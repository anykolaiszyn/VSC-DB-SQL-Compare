
# Local test-database containers for T-17 (SQL Server) and T-19 (PostgreSQL)
# connector integration tests. Snowflake (T-18) has no local-container
# equivalent — that task uses a trial account or a documented
# skip-if-unavailable path instead, per IMPLEMENTATION-PLAN.md.
#
# Usage: docker compose -f docker-compose.test.yml up -d
#
# Credentials here are throwaway, local-only, non-production values for a
# disposable dev container — not a violation of the project's
# no-inline-credentials rule, which governs parity YAML definitions and
# committed application config, not local test infrastructure bootstrap.
# Connector integration tests must still read connection details from
# environment variables, never hardcode them in test source.

services:
  sqlserver-test:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ParityLens_Test1!"
      MSSQL_PID: "Developer"
    ports:
      - "14330:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "paritylens"
      POSTGRES_PASSWORD: "ParityLens_Test1!"
      POSTGRES_DB: "paritylens_test"
    ports:
      - "54320:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paritylens -d paritylens_test"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
