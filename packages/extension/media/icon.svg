  <rect x="9" y="7" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.6" fill="none"/>
  <path d="M11.2 13.6L13 15.4L16.6 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
