<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- ParityLens activity-bar icon: two overlapping rounded squares (source vs. target datasets)
       with a checkmark on the overlap, representing a reconciled/parity match. Monochrome,
       stroke="currentColor"/fill="none" so VS Code applies its own theme-appropriate icon color. -->
